name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck (src)
        run: npm run typecheck

      - name: Typecheck (scripts)
        run: npm run typecheck:scripts

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Audit (runtime deps only)
        run: npm audit --omit=dev
        continue-on-error: true # informational - doesn't fail the build on advisories

  dashboard:
    name: Dashboard (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        working-directory: dashboard
        run: npm ci

      - name: Typecheck
        working-directory: dashboard
        run: npm run typecheck

      - name: Build
        working-directory: dashboard
        run: npm run build

  sdk:
    name: SDK (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/javascript/package-lock.json

      - name: Install
        working-directory: sdk/javascript
        run: npm ci

      - name: Typecheck
        working-directory: sdk/javascript
        run: npm run typecheck

      - name: Build
        working-directory: sdk/javascript
        run: npm run build
